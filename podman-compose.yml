# Production: Mediation with GitHub App authorization + Pangolin Newt.
#
# Copy .env.example to .env, populate it and place the GitHub App private key
# at ./secrets/github-app.pem. `podman-compose up -d --build` uses this file.
#
# Mediation runs standalone:
# newt has NO depends_on into it and mediation has no depends_on on newt, so
# `podman-compose up mediation` works alone and newt simply crash-loops until
# you fill PANGOLIN_ENDPOINT / NEWT_ID / NEWT_SECRET in .env.

services:
  mediation:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "${PORT:-4100}:${PORT:-4100}"
    volumes:
      - ./data:/data:Z
      - ./secrets/github-app.pem:/run/secrets/github-app.pem:ro,Z
    env_file: .env
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 10s
    healthcheck:
      # alpine node image has no curl/wget; use node's built-in fetch.
      test: ["CMD", "node", "-e", "fetch(`http://127.0.0.1:$${process.env.PORT || 4100}/api/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Pangolin tunnel client: dials out to your Pangolin instance and proxies
  # traffic to mediation:4100 over this compose network. The target/domain is
  # configured in the Pangolin dashboard, not here. Crash-loops harmlessly
  # until the NEWT_* credentials are set.
  newt:
    image: docker.io/fosrl/newt:latest
    pull_policy: always
    environment:
      PANGOLIN_ENDPOINT: ${PANGOLIN_ENDPOINT}
      NEWT_ID: ${NEWT_ID}
      NEWT_SECRET: ${NEWT_SECRET}
    restart: unless-stopped
